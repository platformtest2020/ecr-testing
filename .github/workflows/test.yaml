name: Refresh GHCR token (Octo STS Test)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # token lasts 1 hour

permissions:
  id-token: write

concurrency:
  group: test-refresh-ghcr-token
  cancel-in-progress: false

env:
  # Repo whose packages ECR pulls; its policy lives in .github/chainguard/ecr-ghcr.sts.yaml
  OCTO_STS_SCOPE: platformtest2020/helm-charts
  OCTO_STS_IDENTITY: ecr-ghcr
  SECRET_ID: ecr-pullthroughcache/github

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_GHCR_REFRESH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Calls Octo STS directly instead of octo-sts/action, because the action
      # revokes its token when the job ends and ECR needs it to stay valid.
      - name: Get Octo STS token and update ECR secret
        run: |
          set -euo pipefail

          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=octo-sts.dev" | jq -r .value)

          resp=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $oidc" \
            "https://octo-sts.dev/sts/exchange?scope=${OCTO_STS_SCOPE}&identity=${OCTO_STS_IDENTITY}")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          if [ "$code" != "200" ]; then
            echo "Octo STS returned HTTP $code: $body"
            exit 1
          fi

          token=$(echo "$body" | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Octo STS did not return a token"
            exit 1
          fi
          echo "::add-mask::$token"

          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string "$(jq -cn --arg t "$token" '{username: "octo-sts", accessToken: $t}')" \
            --query VersionId --output text

      - name: Validate rule (informational)
        run: |
          sleep 30   # give Secrets Manager time to publish the new version
          aws ecr validate-pull-through-cache-rule --ecr-repository-prefix github \
            --query '{isValid: isValid, failure: failure}'
