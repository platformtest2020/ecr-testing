name: Mirror GHCR images to ECR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [mirror-images.txt]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  id-token: write   # AWS OIDC
  packages: read    # GITHUB_TOKEN can read GHCR
  contents: read    # checkout mirror-images.txt

concurrency:
  group: mirror-ghcr
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: imjasonh/setup-crane@v0.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_GHCR_REFRESH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Copy images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "$GH_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          aws ecr get-login-password | crane auth login "$registry" -u AWS --password-stdin

          grep -vE '^\s*(#|$)' mirror-images.txt | while read -r image; do
            repo="github/${image%:*}"
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" \
                   --image-scanning-configuration scanOnPush=true >/dev/null
            echo "Copying ghcr.io/$image -> $registry/github/$image"
            crane copy "ghcr.io/$image" "$registry/github/$image"
          done
