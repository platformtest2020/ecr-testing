issuer: https://token.actions.githubusercontent.com

# Tighten this to the repository's exact owner/name and branch.
# For repositories using immutable OIDC subjects, include the @<numeric-id>
# suffixes emitted by GitHub.
subject_pattern: repo:[^:]+/[^:]+(@[0-9]+/[^:]+@[0-9]+)?:ref:refs/heads/main

permissions:
  packages: read
